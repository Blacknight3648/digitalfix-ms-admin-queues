version: '3.8'

networks:
  digitalfix-net:
    driver: bridge

services:

  # -------------------------------------------------------------------
  # Broker de Mensajería: RabbitMQ con Management Plugin
  # -------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: digitalfix-rabbitmq
    ports:
      - "5672:5672"   # Puerto AMQP
      - "15672:15672" # Consola Web Management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    networks:
      - digitalfix-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------------
  # Broker de Streaming: Apache Kafka en modo KRaft (sin Zookeeper)
  # -------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: digitalfix-kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-29092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    networks:
      - digitalfix-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6

  # -------------------------------------------------------------------
  # Microservicio Gestor de Mensajería (ms-admin-queues)
  # -------------------------------------------------------------------
  ms-admin-queues:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ms-admin-queues
    ports:
      - "${PORT:-8084}:8084"
    environment:
      - PORT=${PORT:-8084}
      - RABBITMQ_HOST=${RABBITMQ_HOST:-rabbitmq}
      - RABBITMQ_PORT=${RABBITMQ_PORT:-5672}
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-admin123}
      - RABBITMQ_VIRTUAL_HOST=${RABBITMQ_VIRTUAL_HOST:-/}
      - RABBITMQ_MANAGEMENT_URL=${RABBITMQ_MANAGEMENT_URL:-http://rabbitmq:15672}
      # Destino de los flujos email, dispatch y report (ms-notify en la misma red digitalfix-net)
      - MS_NOTIFY_URL=${MS_NOTIFY_URL:-http://ms-digitalfix-notify:8083}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - KAFKA_DEFAULT_REPLICAS=${KAFKA_DEFAULT_REPLICAS:-1}
      - ADMIN_PROTECTED_RESOURCES=${ADMIN_PROTECTED_RESOURCES:-q.cmd.*,cmd.*,workorders.events*,audit.timeline}
    networks:
      - digitalfix-net
    depends_on:
      rabbitmq:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
