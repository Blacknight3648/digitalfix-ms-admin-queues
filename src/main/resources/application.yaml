server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-admin-queues

  # Configuración de Conexión a RabbitMQ
  rabbitmq:
    # Nodos del clúster separados por coma: si se cae uno, el cliente reconecta al otro.
    # Sin RABBITMQ_ADDRESSES se usa RABBITMQ_HOST:RABBITMQ_PORT (un solo nodo).
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    address-shuffle-mode: random  # reparte las conexiones entre los nodos
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    # Publicación confiable: el broker confirma cada evento (publisher confirm) y devuelve el que
    # ninguna cola recibe (mandatory). PublicadorEventosServiceImpl espera ambos antes de responder.
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
    listener:
      simple:
        acknowledge-mode: manual  # ACK solo cuando el destino respondió 2xx
        prefetch: 1               # 1 mensaje en vuelo por hilo
        concurrency: 1            # hilos mínimos de consumo por cola
        max-concurrency: 3        # hilos máximos de consumo por cola
        # Los reintentos los maneja ManejadorFallosEntrega (app.rabbitmq.retry), no el contenedor.
        retry:
          enabled: false

  # Configuración de Conexión a Apache Kafka (administración centralizada de tópicos)
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    admin:
      fail-fast: false

kafka:
  default-replicas: ${KAFKA_DEFAULT_REPLICAS:1}
  admin:
    request-timeout-ms: ${KAFKA_ADMIN_REQUEST_TIMEOUT_MS:5000}
  topics:
    - name: workorders.events
      partitions: 3
      replicas: ${KAFKA_DEFAULT_REPLICAS:1}
      configs:
        cleanup.policy: delete
        retention.ms: "604800000"
    - name: audit.timeline
      partitions: 3
      replicas: ${KAFKA_DEFAULT_REPLICAS:1}
      configs:
        cleanup.policy: compact,delete
        retention.ms: "2592000000"
    - name: workorders.events.DLT
      partitions: 3
      replicas: ${KAFKA_DEFAULT_REPLICAS:1}
      configs:
        cleanup.policy: delete
        retention.ms: "1209600000"
    - name: workorders.events.DLT-report
      partitions: 3
      replicas: ${KAFKA_DEFAULT_REPLICAS:1}
      configs:
        cleanup.policy: delete
        retention.ms: "1209600000"

app:
  admin:
    # Recursos del sistema (administrados centralmente por ms-admin-queues): no se pueden borrar ni desvincular por la API.
    # Nombres exactos o prefijos terminados en '*'.
    protected-resources: ${ADMIN_PROTECTED_RESOURCES:q.cmd.*,cmd.*,workorders.events*,audit.timeline}
    # URL de la API HTTP de RabbitMQ Management (puerto 15672) para listar colas, exchanges y bindings.
    management-url: ${RABBITMQ_MANAGEMENT_URL:http://${RABBITMQ_HOST:localhost}:${RABBITMQ_MANAGEMENT_PORT:15672}}

  # -------------------------------------------------------------------
  # Topología RabbitMQ (caso, sección 8): única fuente de nombres de colas, exchanges y routing keys
  # de todo el sistema. La lee TopologiaRabbitProperties y se valida al arrancar. Por cada flujo se
  # declaran su cola, su DLQ y sus bindings, se registra su listener (listener-<flujo>) y sus
  # mensajes se entregan por HTTP en "destino". Los productores publican con
  # POST /internal/v1/eventos/<flujo>.
  # -------------------------------------------------------------------
  rabbitmq:
    exchanges:
      direct: cmd.direct      # comandos por routing key exacta
      topic: cmd.topic        # los mismos comandos por patrón (con subtipo: email.asignada)
      dlx: cmd.dead.dlx       # Dead Letter Exchange (direct) hacia las DLQ
    flujos:
      email:                  # Email/push al cliente (creada, asignada, en camino, cerrada)
        cola: q.cmd.email
        dlq: q.cmd.email.dlq
        routing-key: email.send
        patron-topic: email.*
        routing-key-dlq: email.dead
        destino: ${MS_NOTIFY_URL:http://localhost:8083}/internal/v1/notificaciones/email
      dispatch:               # Ticket de despacho / orden de terreno al técnico
        cola: q.cmd.dispatch
        dlq: q.cmd.dispatch.dlq
        routing-key: dispatch.ticket
        patron-topic: dispatch.#
        routing-key-dlq: dispatch.dead
        destino: ${MS_NOTIFY_URL:http://localhost:8083}/internal/v1/notificaciones/despacho
      report:                 # Generación de PDF (informe técnico o certificado de trabajo)
        cola: q.cmd.report
        dlq: q.cmd.report.dlq
        routing-key: report.gen
        patron-topic: report.*
        routing-key-dlq: report.dead
        destino: ${MS_NOTIFY_URL:http://localhost:8083}/internal/v1/notificaciones/informe
    # Tiempo que un mensaje fallido se conserva en su DLQ para revisarlo
    dlq-ttl: 24h
    # Errores transitorios (destino caído, 5xx, timeout): reintentos antes de derivar a la DLQ
    retry:
      max-attempts: 3
    # Entrega HTTP al microservicio de destino (enviar un correo SMTP puede tardar varios segundos)
    entrega:
      connect-timeout: 3s
      read-timeout: 20s
    # Espera máxima de la confirmación del broker al publicar un evento
    publicacion:
      confirm-timeout: 5s

  # Topología centralizada de RabbitMQ (declarada por RabbitTopologyConfig)
  topology:
    exchanges:
      - name: cmd.direct      # Exchange principal para envío directo de comandos (ms-workorders -> colas)
        type: DIRECT
        durable: true
        auto-delete: false
      - name: cmd.topic       # Exchange por tópicos para enrutamiento flexible de comandos
        type: TOPIC
        durable: true
        auto-delete: false
      - name: cmd.dead.dlx    # Dead Letter Exchange centralizado para mensajes fallidos (.dlq)
        type: DIRECT
        durable: true
        auto-delete: false
    queues:
      # Cola de envío de correos electrónicos (consumida por ms-notify)
      - name: q.cmd.email
        durable: true
        dead-letter-exchange: cmd.dead.dlx
        dead-letter-routing-key: email.send.dlq
        dlq-name: q.cmd.email.dlq
        dlq-message-ttl: 86400000
        bindings:
          - exchange: cmd.direct
            routing-key: email.send
          - exchange: cmd.topic
            routing-key: email.send
      # Cola de despacho de tickets / órdenes de trabajo (publicada por ms-workorders, consumida por ms-notify)
      - name: q.cmd.dispatch
        durable: true
        dead-letter-exchange: cmd.dead.dlx
        dead-letter-routing-key: dispatch.ticket.dlq
        dlq-name: q.cmd.dispatch.dlq
        dlq-message-ttl: 86400000
        bindings:
          - exchange: cmd.direct
            routing-key: dispatch.ticket
          - exchange: cmd.topic
            routing-key: dispatch.ticket
      # Cola de generación de reportes (publicada por ms-workorders/reportes, consumida por ms-notify/reportes)
      - name: q.cmd.report
        durable: true
        dead-letter-exchange: cmd.dead.dlx
        dead-letter-routing-key: report.generate.dlq
        dlq-name: q.cmd.report.dlq
        dlq-message-ttl: 86400000
        bindings:
          - exchange: cmd.direct
            routing-key: report.generate
          - exchange: cmd.topic
            routing-key: report.generate
  listeners:
    # Los @RabbitListener viven en ms-notify: el control de listeners se delega a su API interna.
    notify-url: ${MS_NOTIFY_URL:http://localhost:8083}

digitalfix:
  # ms-user: fuente del rol de negocio (USUARIOS/ROLES) para la autorización por rol.
  ms-user:
    url: ${MS_USER_URL:http://localhost:8082}

# Documentación OpenAPI / Swagger UI: http://localhost:8084/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Monitoreo con Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    rabbitmq:
      enabled: true
