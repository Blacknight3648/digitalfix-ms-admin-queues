server:
  port: ${PORT:8084}

spring:
  application:
    name: ms-admin-queues

  # Configuración de Conexión a RabbitMQ
  rabbitmq:
    # Nodos del clúster separados por coma: si se cae uno, el cliente reconecta al otro.
    # Sin RABBITMQ_ADDRESSES se usa RABBITMQ_HOST:RABBITMQ_PORT (un solo nodo).
    addresses: ${RABBITMQ_ADDRESSES:${RABBITMQ_HOST:localhost}:${RABBITMQ_PORT:5672}}
    address-shuffle-mode: random  # reparte las conexiones entre los nodos
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin123}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3

app:
  admin:
    # Recursos del sistema (los declara ms-notify): no se pueden borrar ni desvincular por la API.
    # Nombres exactos o prefijos terminados en '*'.
    protected-resources: ${ADMIN_PROTECTED_RESOURCES:q.cmd.*,cmd.*}
  listeners:
    # Los @RabbitListener viven en ms-notify: el control de listeners se delega a su API interna.
    notify-url: ${MS_NOTIFY_URL:http://localhost:8083}

# Documentación OpenAPI / Swagger UI: http://localhost:8084/swagger-ui.html
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Monitoreo con Spring Boot Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  health:
    rabbitmq:
      enabled: true
